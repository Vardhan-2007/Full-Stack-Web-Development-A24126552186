<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events and Fetch API</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px 8%; }
    #hoverBox { width: 220px; padding: 20px; background: #dde8f7; text-align: center; margin: 10px 0; }
    #users li { margin: 4px 0; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Event Listeners and Fetch API</h1>

  <h2>Click counter</h2>
  <button id="clickBtn">Click me</button>
  <span id="clickCount">0 clicks</span>

  <h2>Mouse events</h2>
  <div id="hoverBox">Move the mouse over this box</div>

  <h2>Keyboard event</h2>
  <input id="typeBox" placeholder="Type something">
  <p>Characters typed: <span id="charCount">0</span></p>

  <h2>Fetch users (Promises and async/await)</h2>
  <button id="loadBtn">Load users</button>
  <ul id="users"></ul>

  <script src="app.js"></script>
</body>
</html>
